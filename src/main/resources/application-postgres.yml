# Production profile: real PostgreSQL with Flyway-managed schema.
# Activate with: --spring.profiles.active=postgres
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentsflow}
    username: ${DB_USER:paymentsflow}
    password: ${DB_PASSWORD:paymentsflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema in production; Hibernate only validates against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      show-details: when_authorized
